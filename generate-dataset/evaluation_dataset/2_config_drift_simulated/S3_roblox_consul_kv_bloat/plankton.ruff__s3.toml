  mccabe:
    max-complexity: 10
  pylint:
    max-args: 5
    max-positional-args: 5
    max-statements: 50
    max-branches: 12
    max-returns: 6
    max-nested-blocks: 5
  isort:
    known-first-party:
    - app
  per-file-ignores:
    '!tests/**/*':
    - PT
    tests/**/test_*.py:
    - D103
    - E
    - F
    - B
    - C901
    - PLR
    - S
    - TC
    - N
    - ARG
    - RUF029
    - ERA001
    - PLC
    - SIM
    - TRY
    - RET
    - RUF
    - PLW
    - UP
    - PERF
    - FURB
    tests/**/conftest.py:
    - S
    - N
    - ARG
    - PLC2701
    - PLC0415
    - SIM
    - TRY
    - RET
    - RUF
    - PLW
    - TC
    - UP
    - PERF
    - FURB
    - E
    - G
    tests/constants.py:
    - D
    - ERA001
  flake8-pytest-style:
    raises-extend-require-match-for:
    - pydantic.ValidationError
    - pydantic_core._pydantic_core.ValidationError
    - AttributeError
    - FileNotFoundError
    - asyncio.CancelledError
  pydocstyle:
    convention: google
