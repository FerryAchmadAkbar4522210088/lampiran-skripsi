project:
  name: meilisearch-mcp
  version: 0.6.0
  description: MCP server for Meilisearch
  requires-python: '>=3.10'
  dependencies:
  - meilisearch>=0.38.0
  - mcp>=1.23.1
  - httpx>=0.28.1
  - pydantic>=2.12.5
  - meilisearch>=0.38.0
  - mcp>=1.23.1
  - httpx>=0.28.1
  - pydantic>=2.12.5
  scripts:
    meilisearch-mcp: meilisearch_mcp.server:main
build-system:
  requires:
  - setuptools>=42
  build-backend: setuptools.build_meta
tool:
  hatch:
    build:
      targets:
        wheel:
          packages:
          - src/meilisearch_mcp
  pytest:
    ini_options:
      pythonpath:
      - .
      testpaths:
      - tests
      asyncio_mode: auto
      asyncio_default_fixture_loop_scope: function
  black:
    line-length: 88
    target-version:
    - py310
    include: \.pyi?$
