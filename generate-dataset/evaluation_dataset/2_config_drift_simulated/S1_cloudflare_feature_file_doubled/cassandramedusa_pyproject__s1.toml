tool:
  poetry:
    name: cassandra-medusa
    version: 0.29.0-dev
    description: Apache Cassandra backup and restore tool
    authors:
    - The Last Pickle <medusa@thelastpickle.com>
    license: Apache
    readme: README.md
    homepage: https://github.com/thelastpickle/cassandra-medusa
    classifiers:
    - 'Development Status :: 4 - Beta'
    - 'Environment :: Console'
    - 'Intended Audience :: System Administrators'
    - 'License :: OSI Approved :: Apache Software License'
    - 'Programming Language :: Python :: 3.9'
    - 'Topic :: Database'
    - 'Topic :: System :: Archiving :: Backup'
    - 'Development Status :: 4 - Beta'
    - 'Environment :: Console'
    - 'Intended Audience :: System Administrators'
    - 'License :: OSI Approved :: Apache Software License'
    - 'Programming Language :: Python :: 3.9'
    - 'Topic :: Database'
    - 'Topic :: System :: Archiving :: Backup'
    packages:
    - include: medusa
    include:
    - path: medusa-example.ini
    scripts:
      medusa:
        reference: medusa.medusacli:cli
        type: console
      medusa-wrapper:
        reference: medusa.scripts.medusa_wrapper:main
        type: console
    dependencies:
      python: '>=3.10.0,<3.13'
      python-dateutil: 2.8.1
      setuptools: 78.1.1
      click: 8.1.7
      click-aliases: 1.0.1
      PyYAML: 6.0.1
      cassandra-driver: 3.29.2
      psutil: 5.9.6
      lockfile: 0.12.2
      pyOpenSSL: 26.0.0
      cryptography: 46.0.7
      pycryptodome: 3.19.1
      tenacity: 9.1.2
      ssh2-python: 1.1.1
      ssh-python: 1.1.0
      parallel-ssh: 2.14.0
      requests: 2.33.0
      wheel: 0.46.2
      gevent: 25.4.1
      greenlet: 3.2.0
      fasteners: '0.16'
      datadog: 0.47.0
      botocore: 1.40.41
      boto3: 1.40.41
      dnspython: 2.6.1
      asyncio: 3.4.3
      aiohttp: 3.13.4
      aiofiles: 23.2.1
      gcloud-aio-storage: 9.6.0
      azure-core: 1.38.0
      azure-identity: 1.16.1
      azure-storage-blob: 12.17.0
      urllib3: 2.6.3
      pyjwt: 2.12.0
      pyasn1: 0.6.3
    group:
      grpc:
        dependencies:
          protobuf: 6.33.6
          grpcio: 1.80.0
          grpcio-health-checking: 1.80.0
          grpcio-tools: 1.80.0
      grpc-runtime:
        dependencies:
          grpcio: 1.80.0
          grpcio-health-checking: 1.80.0
      test:
        dependencies:
          behave: 1.2.6
          flake8: 3.7.9
          nose: 1.3.7
          coverage: 7.3.2
          pytest-cov: 4.1.0
          tox: 4.11.3
project:
  name: cassandra-medusa
  requires-python: '>=3.10.0,<3.13'
build-system:
  requires:
  - poetry-core>=1.0.0,<2.0.0
  build-backend: poetry.core.masonry.api
